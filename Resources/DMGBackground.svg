<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F9FB"/>
      <stop offset="1" stop-color="#ECEEF3"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2487F7"/>
      <stop offset="1" stop-color="#1266D4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A3D7A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="url(#background)"/>
  <circle cx="70" cy="46" r="58" fill="#2487F7" opacity="0.06"/>
  <circle cx="608" cy="382" r="92" fill="#1266D4" opacity="0.05"/>

  <text x="330" y="55"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="25" font-weight="650" fill="#171A20">安装 QuitHide</text>
  <text x="330" y="84"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="14" fill="#667085">把左侧 App 拖到右侧“应用程序”文件夹</text>

  <g filter="url(#shadow)">
    <rect x="270" y="186" width="106" height="36" rx="18" fill="url(#arrow)"/>
    <path d="M347 173 L382 204 L347 235 Z" fill="#1266D4"/>
    <path d="M292 204 H357" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M345 190 L361 204 L345 218" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="155" y="311" width="350" height="57" rx="24" fill="#FFFFFF" opacity="0.86"/>
  <text x="330" y="336"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="15" font-weight="600" fill="#344054">拖入后，请从“应用程序”中打开 QuitHide</text>
  <text x="330" y="357"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="11" fill="#98A2B3">Drag QuitHide to Applications, then open it from there.</text>
</svg>
